name: test

on:
  push:
    branches:
      - 'master'
      - 'releases/v*'
  pull_request:
    branches:
      - 'master'
      - 'releases/v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26  # v3
      -
        name: Validate
        uses: docker/bake-action@6c87dcca988e4e074e3ab1f976a70f63ec9673fb  # v2
        with:
          targets: validate
      -
        name: Test
        uses: docker/bake-action@6c87dcca988e4e074e3ab1f976a70f63ec9673fb  # v2
        with:
          targets: test
      -
        name: Upload coverage
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457  # v3
        with:
          file: ./coverage/clover.xml
