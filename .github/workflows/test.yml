name: test

# PMG (SafeDep Package Manager Guard) is wired into every job in this file.
# See .github/PMG-INTEGRATION.md for the per-job rationale.
on:
  push:
    branches:
      - 'master'
      - 'releases/v*'
  pull_request:
    branches:
      - 'master'
      - 'releases/v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Setup PMG proxy
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      -
        name: Validate
        uses: docker/bake-action@v2
        with:
          targets: validate
      -
        name: Test
        uses: docker/bake-action@v2
        with:
          targets: test
      -
        name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/clover.xml
      -
        name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
